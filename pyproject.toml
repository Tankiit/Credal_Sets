[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-audit"
version = "0.1.0"
description = "Library-independent supervised concept models and equivalence audits"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.56.0", "timm>=1.0", "numpy", "scipy", "scikit-learn", "pandas", "datasets>=2.20", "pillow", "tqdm", "tensorboard"]

[project.optional-dependencies]
concepts = ["pytorch-concepts==1.0.0a5"]

[project.scripts]
concept-audit = "concept_audit.experiment:main"
concept-audit-synthetic = "experiments.synthetic.run:main"
concept-audit-real = "experiments.real.run:main"
concept-audit-extract = "experiments.real.extract:main"

[tool.setuptools.packages.find]
include = ["concept_audit*", "experiments*", "models*", "dataloaders*"]

[tool.setuptools.package-data]
"experiments.synthetic" = ["configs/*.json"]
"experiments.real" = ["configs/*.json"]
