name = "Credal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Credal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Credal"
path = "."  # This tells Lean to look in the root folder
